<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify - Contul Meu</title>
  <link rel = "stylesheet" href = "accountstyle.css">
</head>
<body>

  <header>
    <div class="logo">Spotify</div>
    <nav>
      <a href="#">Acasă</a>
      <a href="#">Bibliotecă</a>
      <a href="#">Căutare</a>
      <a href="#">Setări</a>
      <a href="#">Deconectare</a>
    </nav>
  </header>

  <div class="container">
    <div class="profile">
      <img src="https://via.placeholder.com/80" alt="Profil" />
      <div class="profile-info">
        <h2>Nume Utilizator</h2>
        <p>Cont Premium</p>
      </div>
    </div>

    <div class="section">
      <h3>Playlist-uri recente</h3>
      <div class="playlist">
        <div class="playlist-item">
          <img src="https://via.placeholder.com/150" alt="Playlist" />
          <p>Chill Vibes</p>
        </div>
        <div class="playlist-item">
          <img src="https://via.placeholder.com/150" alt="Playlist" />
          <p>Top Hits</p>
        </div>
        <div class="playlist-item">
          <img src="https://via.placeholder.com/150" alt="Playlist" />
          <p>Indie Mix</p>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>Podcast-uri favorite</h3>
      <div class="playlist">
        <div class="playlist-item">
          <img src="https://via.placeholder.com/150" alt="Podcast" />
          <p>Tech Talks</p>
        </div>
        <div class="playlist-item">
          <img src="https://via.placeholder.com/150" alt="Podcast" />
          <p>Muzică și Poveste</p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    © 2025 Spotify - Contul Meu Demo
  </footer>

</body>
</html>
